[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lednifrolg/melcloud-ac"
publish = false

[workspace.dependencies]
bitflags = "2.13"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
# `charset` is left out: responses are read as bytes and parsed as UTF-8 JSON.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
